[project]
name = "rle-mini-challenge"
version = "0.1.0"
description = "RLE mini-challenge: train a deep RL agent for Atari Space Invaders"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch>=2.9",
    "gymnasium[atari]>=1.2",
    "moviepy>=2.1",
    "opencv-python",
    "ale-py>=0.11",
    "numpy>=2.0",
    "tensorboard",
    "wandb",
    "tyro",
    "absl-py",
    "tensorboardX",
    "stable-baselines3>=2.7",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
